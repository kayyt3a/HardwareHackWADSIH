; ============================================================================
; FOUR ENVIRONMENTS
;   seeed_xiao_esp32s3 (default) — the real firmware, from main.cpp
;   selftest                     — full hardware diagnostic, from selftest.cpp
;   beeptest                     — speaker-only test, from beeptest.cpp
;   ledblink                     — LED-only test, from LedBlink.cpp
;
; All four define setup()/loop(), so exactly one entry-point file must be
; compiled at a time. build_src_filter does that: each environment excludes
; the other three entry points.
;
;   pio run -e selftest -t upload && pio device monitor -e selftest
;   pio run -e beeptest -t upload && pio device monitor -e beeptest
;   pio run -e ledblink -t upload && pio device monitor -e ledblink
; ============================================================================

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; qio_opi = QIO flash + OPI PSRAM. The XIAO ESP32S3's PSRAM chip is wired
; with 8 data lines (Octal / OPI). Without this the build assumes Quad and
; talks to it on the wrong number of wires, so PSRAM never initialises and
; esp_camera_init() fails to allocate a frame buffer — the camera appears
; dead even though the wiring is fine. This is the PlatformIO equivalent of
; setting Tools > PSRAM > "OPI PSRAM" in the Arduino IDE.
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    espressif/esp32-camera
    ; No audio library. The server sends raw 16 kHz mono 16-bit PCM, so
    ; audio_playback.cpp writes samples straight to the IDF's own I2S
    ; driver (<driver/i2s.h>) — nothing to decode, nothing to pin. This
    ; removed a standing version trap: ESP8266Audio 2.x needs IDF 5's
    ; <driver/i2s_std.h>, but this platform is arduino-esp32 2.0.17 (IDF
    ; 4.4), so an unpinned fetch of 2.x broke the build outright.

build_src_filter = +<*> -<selftest.cpp> -<beeptest.cpp> -<LedBlink.cpp>

[env:selftest]
extends = env:seeed_xiao_esp32s3
; Exclude main.cpp (its setup()/loop() would collide) and audio_playback.cpp,
; which exists only to serve main.cpp — the self-test drives I2S directly.
build_src_filter = +<*> -<main.cpp> -<audio_playback.cpp> -<beeptest.cpp> -<LedBlink.cpp>

[env:beeptest]
extends = env:seeed_xiao_esp32s3
; Minimal speaker-only test: fires a beep once a second forever. Exclude
; every other entry point (main.cpp, selftest.cpp, LedBlink.cpp) and
; audio_playback.cpp, which exists only to serve main.cpp.
build_src_filter = +<*> -<main.cpp> -<audio_playback.cpp> -<selftest.cpp> -<LedBlink.cpp>

[env:ledblink]
extends = env:seeed_xiao_esp32s3
; Minimal LED-only test: alternates the onboard LED and one on pad D10.
; Exclude every other entry point and audio_playback.cpp, which exists only
; to serve main.cpp.
build_src_filter = +<*> -<main.cpp> -<audio_playback.cpp> -<selftest.cpp> -<beeptest.cpp>


