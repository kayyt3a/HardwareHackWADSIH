; ============================================================================
; TWO ENVIRONMENTS
;   seeed_xiao_esp32s3 (default) — the real firmware, from main.cpp
;   selftest                     — hardware diagnostic, from selftest.cpp
;
; Both define setup()/loop(), so exactly one of the two source files must be
; compiled at a time. build_src_filter does that: each environment excludes
; the other's entry point.
;
;   pio run -e selftest -t upload && pio device monitor -e selftest
; ============================================================================

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; qio_opi = QIO flash + OPI PSRAM. The XIAO ESP32S3's PSRAM chip is wired
; with 8 data lines (Octal / OPI). Without this the build assumes Quad and
; talks to it on the wrong number of wires, so PSRAM never initialises and
; esp_camera_init() fails to allocate a frame buffer — the camera appears
; dead even though the wiring is fine. This is the PlatformIO equivalent of
; setting Tools > PSRAM > "OPI PSRAM" in the Arduino IDE.
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    espressif/esp32-camera
    ; PIN THIS TO 1.9.x — do not let it float to 2.x.
    ;
    ; ESP8266Audio 2.x targets ESP-IDF 5, where the I2S driver header is
    ; <driver/i2s_std.h>. This platform resolves to arduino-esp32 2.0.17,
    ; which is IDF 4.4 and only has <driver/i2s.h>. Unpinned, PlatformIO
    ; fetches 2.4.1 and the build dies on:
    ;   AudioOutputI2S.h:29: fatal error: driver/i2s_std.h: No such file
    ; The 1.9.x line is the last that supports IDF 4.4, and has the same
    ; AudioOutputI2S API this project uses (SetPinout / ConsumeSample).
    earlephilhower/ESP8266Audio@^1.9.7

build_src_filter = +<*> -<selftest.cpp>

[env:selftest]
extends = env:seeed_xiao_esp32s3
; Exclude main.cpp (its setup()/loop() would collide) and audio_playback.cpp,
; which exists only to serve main.cpp — the self-test drives I2S directly.
build_src_filter = +<*> -<main.cpp> -<audio_playback.cpp>
